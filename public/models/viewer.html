<title>Burg Nachtjagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Spectral:wght@500&display=swap">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<style>
  /* Layout: Vollbild-Bühne mit Titel oben links und einem Schaltpult am unteren Rand. */
  :root {
    color-scheme: dark;
    --night: #0b1116;
    --panel: rgba(21, 34, 42, 0.88);
    --line: #335165;
    --mist: #9eb8c4;
    --snow: #eff0f0;
    --glow: #e0a050;
    --glow-ink: #1a1208;
    --font-display: 'Spectral', Georgia, 'Times New Roman', serif;
    --font-ui: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    background: var(--night);
    color: var(--snow);
    font: 400 15px/1.35 var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  header {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  header h1 {
    margin: 0;
    font: 500 1.7rem/1.1 var(--font-display);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--mist); font-size: 0.9rem; letter-spacing: 0.04em; text-transform: uppercase; }
  #dock {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin-inline: auto;
    max-width: 640px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: rgba(11, 17, 22, 0.7); border-radius: 10px; }
  button {
    font: 500 0.95rem/1 var(--font-ui);
    color: var(--snow);
    background: transparent;
    border: 0;
    border-radius: 8px;
    min-height: 44px;
    padding: 0 12px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .seg button[aria-pressed="true"] { background: var(--glow); color: var(--glow-ink); font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .row label { color: var(--mist); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .row output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--glow); height: 44px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .chips button { flex: none; border: 1px solid var(--line); min-height: 40px; }
  .chips button[aria-pressed="true"] { border-color: var(--glow); color: var(--glow); }
  .pad { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .pad .group { display: flex; gap: 6px; }
  .pad button { border: 1px solid var(--line); min-width: 48px; background: rgba(11, 17, 22, 0.55); touch-action: none; }
  .pad button:active, .pad button.on { background: var(--glow); color: var(--glow-ink); }
  .hint { margin: 0; color: var(--mist); font-size: 0.82rem; }
  [data-panel] { display: none; flex-direction: column; gap: 10px; }
  [data-panel].active { display: flex; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<canvas id="stage"></canvas>
<header>
  <h1>Burg Nachtjagd</h1>
  <p id="modeLine">Außenansicht</p>
</header>

<section id="dock" aria-label="Ansicht">
  <div class="seg" role="group" aria-label="Ansichtsart">
    <button type="button" id="m-exterior" aria-pressed="true">Außen</button>
    <button type="button" id="m-cut" aria-pressed="false">Schnitt</button>
    <button type="button" id="m-walk" aria-pressed="false">Innen</button>
  </div>

  <div data-panel="exterior" class="active">
    <p class="hint">Ziehen dreht die Burg, zwei Finger oder das Mausrad zoomen. Im Schnitt und von innen siehst du die Räume.</p>
  </div>

  <div data-panel="cut">
    <div class="row">
      <label for="cutRange">Schnitthöhe</label>
      <input id="cutRange" type="range" min="2" max="52" step="0.5" value="7">
      <output id="cutOut" for="cutRange">7 m</output>
    </div>
    <div class="chips" id="cutChips" role="group" aria-label="Schnitthöhe wählen">
      <button type="button" data-h="5">Erdgeschoss</button>
      <button type="button" data-h="11">Dachansatz</button>
      <button type="button" data-h="26">Hauptturm</button>
      <button type="button" data-h="38">Turmzimmer</button>
    </div>
  </div>

  <div data-panel="walk">
    <div class="chips" id="roomChips" role="group" aria-label="Raum wählen"></div>
    <div class="pad">
      <div class="group" aria-label="Gehen">
        <button type="button" data-key="left" aria-label="Links">←</button>
        <button type="button" data-key="forward" aria-label="Vor">↑</button>
        <button type="button" data-key="back" aria-label="Zurück">↓</button>
        <button type="button" data-key="right" aria-label="Rechts">→</button>
      </div>
      <div class="group" aria-label="Höhe">
        <button type="button" data-key="up">Hoch</button>
        <button type="button" data-key="down">Runter</button>
      </div>
    </div>
    <p class="hint">Ziehen dreht den Blick. Am PC auch WASD, R und F. Die Wände haben noch keine Türen, die Räume wählst du oben.</p>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildCastle } from './castle.js';
import { buildCastleInterior } from './castle-interior.js';

const $ = (id) => document.getElementById(id);
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1a21);
scene.fog = new THREE.FogExp2(0x1c323c, 0.004);

const hemi = new THREE.HemisphereLight(0x7f98b5, 0x2a4350, 1.9);
const moon = new THREE.DirectionalLight(0xbfd2ea, 2.4);
moon.position.set(-60, 90, 40);
scene.add(hemi, moon);

const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 48), new THREE.MeshLambertMaterial({ color: 0xcfd8df }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

const castle = buildCastle(THREE);
const interior = buildCastleInterior(THREE);
scene.add(castle, interior);

// Schnittebene: behält alles unterhalb der Höhe h. Alle Materialien zweiseitig, damit man in die
// Quader der Außenwände hineinsieht.
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);
const seen = new Set();
for (const root of [castle, interior]) {
  root.traverse((o) => {
    const list = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of list) {
      if (seen.has(m)) continue;
      seen.add(m);
      m.side = THREE.DoubleSide;
      m.clippingPlanes = [cutPlane];
    }
  });
}

// Lichtpool: nur acht Punktlichter, sie wandern zu den Lampen in der Nähe des Blickpunkts.
const lampData = interior.userData.lights;
const pool = Array.from({ length: 8 }, () => {
  const l = new THREE.PointLight(0xffb060, 0, 12, 2);
  scene.add(l);
  return l;
});
const GAIN = 2.2;
const torch = new THREE.PointLight(0xffc880, 0, 14, 2);
scene.add(torch);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 1500);
camera.position.set(78, 52, 105);
const controls = new OrbitControls(camera, canvas);
controls.target.set(-2, 24, 0);
controls.enableDamping = true;
controls.minDistance = 12;
controls.maxDistance = 240;
controls.maxPolarAngle = Math.PI * 0.495;

let mode = 'exterior';
const walk = { yaw: 0, pitch: 0, keys: new Set() };
const modeNames = { exterior: 'Außenansicht', cut: 'Schnitt durch die Burg', walk: 'Rundgang innen' };
let currentRoom = null;

function setMode(next) {
  mode = next;
  for (const m of ['exterior', 'cut', 'walk']) {
    $('m-' + m).setAttribute('aria-pressed', String(m === next));
    document.querySelector(`[data-panel="${m}"]`).classList.toggle('active', m === next);
  }
  $('modeLine').textContent = modeNames[next];
  interior.visible = next !== 'exterior';
  controls.enabled = next !== 'walk';
  torch.intensity = next === 'walk' ? 14 : 0;
  hemi.intensity = next === 'walk' ? 0.35 : next === 'cut' ? 2.0 : 1.9;
  moon.intensity = next === 'walk' ? 0.2 : next === 'cut' ? 1.8 : 2.4;
  scene.fog.density = next === 'walk' ? 0.0015 : 0.004;
  cutPlane.constant = next === 'cut' ? Number($('cutRange').value) : 1000;
  if (next === 'cut') {
    controls.target.set(-2, Math.min(Number($('cutRange').value), 20), 0);
    camera.position.set(34, 56, 48);
  } else if (next === 'exterior') {
    controls.target.set(-2, 24, 0);
    camera.position.set(78, 52, 105);
  } else if (!currentRoom) {
    goRoom('saal');
  }
}

function goRoom(id) {
  const r = interior.userData.rooms.find((x) => x.id === id);
  if (!r) return;
  currentRoom = id;
  camera.position.set(r.spawn.x, r.spawn.y, r.spawn.z);
  const dx = r.look.x - r.spawn.x;
  const dz = r.look.z - r.spawn.z;
  walk.yaw = Math.atan2(-dx, -dz);
  walk.pitch = Math.atan2(r.look.y - r.spawn.y, Math.hypot(dx, dz));
  applyWalkRotation();
  for (const b of $('roomChips').children) b.setAttribute('aria-pressed', String(b.dataset.room === id));
  $('modeLine').textContent = r.name;
}

function applyWalkRotation() {
  camera.rotation.order = 'YXZ';
  walk.pitch = Math.max(-1.3, Math.min(1.3, walk.pitch));
  camera.rotation.set(walk.pitch, walk.yaw, 0);
}

// Bedienung
$('m-exterior').onclick = () => setMode('exterior');
$('m-cut').onclick = () => setMode('cut');
$('m-walk').onclick = () => setMode('walk');
$('cutRange').oninput = (e) => {
  const h = Number(e.target.value);
  $('cutOut').textContent = h + ' m';
  if (mode === 'cut') cutPlane.constant = h;
};
for (const b of $('cutChips').children) {
  b.onclick = () => {
    $('cutRange').value = b.dataset.h;
    $('cutRange').dispatchEvent(new Event('input'));
  };
}
for (const r of interior.userData.rooms) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = r.name;
  b.dataset.room = r.id;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => goRoom(r.id);
  $('roomChips').appendChild(b);
}
for (const b of document.querySelectorAll('.pad [data-key]')) {
  const k = b.dataset.key;
  const on = (e) => { e.preventDefault(); walk.keys.add(k); b.classList.add('on'); };
  const off = () => { walk.keys.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off);
  b.addEventListener('pointercancel', off);
}
const keyMap = { KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyR: 'up', KeyF: 'down' };
addEventListener('keydown', (e) => { if (mode === 'walk' && keyMap[e.code]) { walk.keys.add(keyMap[e.code]); e.preventDefault(); } });
addEventListener('keyup', (e) => { if (keyMap[e.code]) walk.keys.delete(keyMap[e.code]); });

let drag = null;
canvas.addEventListener('pointerdown', (e) => { if (mode === 'walk') { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove', (e) => {
  if (mode !== 'walk' || !drag) return;
  walk.yaw -= (e.clientX - drag.x) * 0.005;
  walk.pitch -= (e.clientY - drag.y) * 0.005;
  drag.x = e.clientX;
  drag.y = e.clientY;
  applyWalkRotation();
});
canvas.addEventListener('pointerup', () => { drag = null; });

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function assignLights(focus) {
  const sorted = lampData
    .map((l) => ({ l, d: (l.x - focus.x) ** 2 + (l.y - focus.y) ** 2 + (l.z - focus.z) ** 2 }))
    .sort((a, b) => a.d - b.d);
  pool.forEach((p, i) => {
    const s = sorted[i] && sorted[i].l;
    if (!s || mode === 'exterior') { p.intensity = 0; return; }
    p.position.set(s.x, s.y, s.z);
    p.color.setHex(s.color);
    p.intensity = s.intensity * GAIN;
    p.distance = s.distance;
  });
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mode === 'walk') {
    const speed = 4.5 * dt;
    const f = (walk.keys.has('forward') ? 1 : 0) - (walk.keys.has('back') ? 1 : 0);
    const s = (walk.keys.has('right') ? 1 : 0) - (walk.keys.has('left') ? 1 : 0);
    camera.position.x += (-Math.sin(walk.yaw) * f + Math.cos(walk.yaw) * s) * speed;
    camera.position.z += (-Math.cos(walk.yaw) * f - Math.sin(walk.yaw) * s) * speed;
    camera.position.y += ((walk.keys.has('up') ? 1 : 0) - (walk.keys.has('down') ? 1 : 0)) * speed;
    torch.position.copy(camera.position);
    assignLights(camera.position);
  } else {
    controls.update();
    assignLights(controls.target);
  }
  renderer.render(scene, camera);
});

window.__viewer = { setMode, goRoom, cutPlane, camera, controls };
</script>
