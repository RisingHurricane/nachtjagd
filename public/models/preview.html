<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modellvorschau</title>
<style>html,body{margin:0;height:100%;background:#0b1116;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
// Vorschau für Modelle aus public/models. Aufruf: preview.html?model=castle&view=front
// Ansichten: front, back, side, aerial, free (Maus ziehen = drehen, Rad = Zoom)
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const modelName = q.get('model') || 'castle';
const view = q.get('view') || 'front';
const mod = await import('./' + modelName + '.js');
const build = mod['build' + modelName[0].toUpperCase() + modelName.slice(1)];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9eb8c4);
scene.fog = new THREE.FogExp2(0x9eb8c4, Number(q.get('fog') || 0.006));

scene.add(new THREE.HemisphereLight(0xb4c0cb, 0x303b4f, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 1.6);
sun.position.set(-40, 60, 50);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(300, 48), new THREE.MeshLambertMaterial({ color: 0xeff0f0 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

const model = build(THREE, {});
scene.add(model);
const info = model.userData;
document.title = 'Modellvorschau: ' + (info.kind || modelName);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 1200);
const h = info.height || 30;
const d = Math.max((info.footprint && info.footprint.w) || 40, (info.footprint && info.footprint.d) || 40);
const views = {
  front: [0, h * 0.55, d * 1.9, 0, h * 0.4, 0],
  back: [0, h * 0.55, -d * 1.9, 0, h * 0.4, 0],
  side: [d * 1.9, h * 0.55, d * 0.3, 0, h * 0.4, 0],
  aerial: [d * 1.2, h * 2.1, d * 1.5, 0, h * 0.3, 0],
  gate: [0, 4, d * 0.95, 0, 8, 0],
};
let yaw = 0.6, pitch = 0.35, dist = d * 2.2;
function place() {
  if (view === 'free') {
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + h * 0.3, Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(0, h * 0.35, 0);
  } else {
    const v = views[view] || views.front;
    camera.position.set(v[0], v[1], v[2]);
    camera.lookAt(v[3], v[4], v[5]);
  }
}
place();
if (view === 'free') {
  let drag = false, lx = 0, ly = 0;
  addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener('pointerup', () => { drag = false; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    yaw -= (e.clientX - lx) * 0.006;
    pitch = Math.max(-0.1, Math.min(1.4, pitch + (e.clientY - ly) * 0.006));
    lx = e.clientX; ly = e.clientY; place();
  });
  addEventListener('wheel', (e) => { dist = Math.max(10, dist * (1 + e.deltaY * 0.001)); place(); });
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.render(scene, camera);
window.__ready = true;
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
